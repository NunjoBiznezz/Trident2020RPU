; PlatformIO Project Configuration File
;default_envs = bsos_rev3_rx

[bally_stern]
; Common build flags for all environments
build_flags =
    -DRPU_MPU_ARCHITECTURE=1
    -DRPU_OS_USE_DIP_SWITCHES
    -DRPU_MPU_BUILD_FOR_6800=1
    -DRPU_OS_USE_WAV_TRIGGER=1


; PlatformIO Project Configuration File
[common]
; Common build flags for all environments
build_flags =
    -DRPU_OS_USE_DIP_SWITCHES
    -DRPU_MPU_BUILD_FOR_6800=1
    -DRPU_OS_USE_WAV_TRIGGER_1p3=1
;    -DRPU_OS_USE_SB100


; Hardware Rev 3 - MEGA 2560 Pro
[env:rpu_os_hardware_rev3]
extends = common
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
    ${common.build_flags}
    -DRPU_OS_HARDWARE_REV=3

; Hardware Rev 4 - MEGA 2560 Pro with display & WIFI
[env:rpu_os_hardware_rev4]
extends = common
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
    ${common.build_flags}
    -DRPU_OS_HARDWARE_REV=4

; Hardware Rev 102 - Second RPU with display and WIFI socket
[env:rpu_os_hardware_rev102]
extends = common
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
    ${common.build_flags}
    -DRPU_OS_HARDWARE_REV=102

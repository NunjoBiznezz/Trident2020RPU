; Hardware Rev 3 - MEGA 2560 Pro (original)
[env:bsos_rev3]
extends = bally_stern
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
    ${bally_stern.build_flags}
    -DRPU_OS_HARDWARE_REV=3
    -DWAVTRIGGER_LACKS_RX=1
    -DRPU_OS_USE_SB100=1

; Hardware Rev 3 - MEGA 2560 Pro (RX line added to WAV Trigger)
[env:bsos_rev3_rx]
extends = bally_stern
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
    ${bally_stern.build_flags}
    -DRPU_OS_HARDWARE_REV=3
    -DRPU_OS_USE_SB100=1


; PlatformIO Project Configuration File


; Hardware Rev 3 - MEGA 2560 Pro
[env:rpu_os_hardware_rev3]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = 
    -DRPU_OS_HARDWARE_REV=3
    -DRPU_MPU_ARCHITECTURE=1
    -DRPU_MPU_BUILD_FOR_6800=1
    -DRPU_OS_USE_DIP_SWITCHES
    -DRPU_OS_USE_SB100

; Hardware Rev 4 - MEGA 2560 Pro with display & WIFI
[env:rpu_os_hardware_rev4]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = 
    -DRPU_OS_HARDWARE_REV=4
    -DRPU_MPU_ARCHITECTURE=1
    -DRPU_MPU_BUILD_FOR_6800=1
    -DRPU_OS_USE_DIP_SWITCHES
    -DRPU_OS_USE_SB100
    -DRPU_DEBUG_MESSAGES=1

; Hardware Rev 102 - Second RPU with display and WIFI socket
[env:rpu_os_hardware_rev102]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = 
    -DRPU_OS_HARDWARE_REV=102
    -DRPU_MPU_ARCHITECTURE=1
    -DRPU_MPU_BUILD_FOR_6800=1
    -DRPU_OS_USE_SB100
    -DDEBUG_MESSAGES

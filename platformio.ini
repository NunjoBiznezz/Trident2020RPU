; PlatformIO Project Configuration File
;default_envs = bsos_rev3_rx

; =============================================================================
; Debug output — all disabled by default
;
; Three independent flags control debug output. All require DEBUG_PORT to be
; set; omitting DEBUG_PORT disables all debug and serial init regardless of
; the message flags.
;
;   -DDEBUG_PORT=SerialX      Serial port to use for debug output.
;                             Valid values: Serial, Serial1, Serial2, Serial3
;                             Rev 3 uses Serial for WAV Trigger — use Serial2+
;                             Rev 4+ use Serial1 for WAV Trigger — Serial is free
;
;   -DDEBUG_MESSAGES          Enables game-code debug: DEBUG_MESSAGE() calls
;                             and the build-info banner printed at boot.
;                             Requires DEBUG_PORT.
;
;   -DRPU_DEBUG_MESSAGES      Enables RPU library debug: hardware-level
;                             messages from RPU_Internal.h macros.
;                             Requires DEBUG_PORT.
;
; Examples (add to any env's build_flags):
;
;   Game debug only on Serial2:
;     -DDEBUG_PORT=Serial2 -DDEBUG_MESSAGES
;
;   RPU library debug only on Serial2:
;     -DDEBUG_PORT=Serial2 -DRPU_DEBUG_MESSAGES
;
;   Both on Serial2:
;     -DDEBUG_PORT=Serial2 -DDEBUG_MESSAGES -DRPU_DEBUG_MESSAGES
;
;   Monitor: pio device monitor -b 115200  (reset board to see boot banner)
; =============================================================================

; Applied to every [env:*] section automatically.
; RPU now lives in its own repo (https://github.com/NunjoBiznezz/RPU) —
; bump the #vX.Y.Z tag here to pull a newer release.
[env]
lib_deps =
    https://github.com/NunjoBiznezz/RPU.git#v5.7.0
    https://github.com/NunjoBiznezz/WavTrigger.git#v1.0.0

[bally_stern]
; Common build flags for all environments
extra_scripts = pre:extra_scripts/build_info.py
build_flags =
    -DRPU_MPU_ARCHITECTURE=1
    -DRPU_OS_USE_DIP_SWITCHES
    -DRPU_MPU_BUILD_FOR_6800=1
    -DRPU_OS_USE_WAV_TRIGGER=1

